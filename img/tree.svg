<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-label="Tree diagram for two cakes chosen without replacement, modern M or traditional T">
  <rect width="460" height="260" fill="#FBF8F2"/>
  <text x="70" y="24" font-size="12" fill="#5B6770">First cake</text>
  <text x="280" y="24" font-size="12" fill="#5B6770">Second cake</text>
  <!-- first branches -->
  <line x1="40" y1="130" x2="150" y2="60" stroke="#2A6F6F" stroke-width="2"/>
  <line x1="40" y1="130" x2="150" y2="200" stroke="#2A6F6F" stroke-width="2"/>
  <!-- second from M -->
  <line x1="170" y1="60" x2="280" y2="30" stroke="#2A6F6F" stroke-width="2"/>
  <line x1="170" y1="60" x2="280" y2="90" stroke="#2A6F6F" stroke-width="2"/>
  <!-- second from T -->
  <line x1="170" y1="200" x2="280" y2="170" stroke="#2A6F6F" stroke-width="2"/>
  <line x1="170" y1="200" x2="280" y2="230" stroke="#2A6F6F" stroke-width="2"/>
  <circle cx="40" cy="130" r="5" fill="#1B3A4B"/>
  <text x="95" y="85" font-size="13" fill="#1B3A4B">5/8</text>
  <text x="95" y="185" font-size="13" fill="#1B3A4B">3/8</text>
  <text x="175" y="55" font-size="15" font-weight="700" fill="#1B3A4B">M</text>
  <text x="175" y="215" font-size="15" font-weight="700" fill="#1B3A4B">T</text>
  <text x="210" y="35" font-size="13" fill="#1B3A4B">4/7</text>
  <text x="210" y="90" font-size="13" fill="#1B3A4B">3/7</text>
  <text x="210" y="165" font-size="13" fill="#1B3A4B">5/7</text>
  <text x="210" y="230" font-size="13" fill="#1B3A4B">2/7</text>
  <text x="300" y="35" font-size="15" font-weight="700" fill="#1B3A4B">M</text>
  <text x="300" y="95" font-size="15" font-weight="700" fill="#1B3A4B">T</text>
  <text x="300" y="175" font-size="15" font-weight="700" fill="#1B3A4B">M</text>
  <text x="300" y="235" font-size="15" font-weight="700" fill="#1B3A4B">T</text>
  <text x="355" y="35" font-size="12" fill="#5B6770">MM</text>
  <text x="355" y="95" font-size="12" fill="#5B6770">MT</text>
  <text x="355" y="175" font-size="12" fill="#5B6770">TM</text>
  <text x="355" y="235" font-size="12" fill="#5B6770">TT</text>
</svg>